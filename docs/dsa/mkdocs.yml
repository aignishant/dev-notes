site_name: DSA & System Design Bible
site_description: A self-contained, beginner-friendly bible for cracking product, service, and PSU interviews — written in simple language, in Python, with progressive solutions and real-world context.
site_author: Nishant Gupta
site_url: ""

# We serve from this folder. The MkDocs `docs/` is below.
docs_dir: docs
site_dir: site

# Show edit URL in pages? Off — this is a personal study bible, not a public repo.
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes      # lets each section/index.md become its landing page
    - navigation.top
    - navigation.footer
    # Header
    - header.autohide
    - announce.dismiss
    # Table of contents
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Code blocks
    - content.code.copy
    - content.code.annotate
    - content.code.select
    # Content tabs (the === "Python" syntax)
    - content.tabs.link
    # Inline tooltips
    - content.tooltips

  palette:
    # Light mode (default for new visitors)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/git-alt
    admonition:
      note: octicons/tag-16
      tip: octicons/light-bulb-16
      warning: octicons/alert-16
      example: octicons/beaker-16

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://unpkg.com/three@0.160.0/build/three.min.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: en
  # Mermaid renders via Material's native superfences pattern (see markdown_extensions
  # below). We do NOT enable mkdocs-mermaid2-plugin here — Material's native path
  # auto-themes diagrams with the light/dark toggle. The plugin remains installed
  # as a fallback if we want to swap later.

markdown_extensions:
  # Core
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 4

  # PyMdown
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

