site_name: Ethical Hacking Mastery
site_description: A comprehensive ethical hacking & cybersecurity reference — from foundations to advanced offensive/defensive operations, oriented toward US & India government cybersecurity careers.
site_author: Aspiring White Hat
copyright: Copyright &copy; 2026 — Educational use only. All techniques are for authorized testing.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/info-16
      tip: octicons/light-bulb-16
      warning: octicons/alert-16
      danger: octicons/stop-16
      example: octicons/beaker-16
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - tags

nav:
  - Home: index.md
  - Getting Started:
      - 00-getting-started/index.md
      - Mindset: 00-getting-started/mindset.md
      - How to Use: 00-getting-started/how-to-use.md
      - Lab Setup: 00-getting-started/lab-setup.md
      - Tooling: 00-getting-started/tooling.md
      - Legal & Ethics: 00-getting-started/legal-ethics.md
      - Study Plan: 00-getting-started/study-plan.md
  - "Phase 1 — Foundations":
      - 01-foundations/index.md
      - Cybersecurity Fundamentals: 01-foundations/cybersecurity-fundamentals.md
      - Networking: 01-foundations/networking.md
      - Linux: 01-foundations/linux.md
      - Windows: 01-foundations/windows.md
      - Cryptography: 01-foundations/cryptography.md
      - Python for Security: 01-foundations/python-for-security.md
  - "Phase 2 — Recon":
      - 02-recon/index.md
      - OSINT: 02-recon/osint.md
      - Passive & Active Recon: 02-recon/passive-active-recon.md
      - Network Scanning: 02-recon/scanning.md
      - Service Enumeration: 02-recon/enumeration.md
      - Vulnerability Assessment: 02-recon/vulnerability-assessment.md
      - Web Recon: 02-recon/web-recon.md
  - "Phase 3 — Offensive":
      - 03-offensive/index.md
      - Web Methodology & OWASP Top 10: 03-offensive/web-methodology.md
      - Injection Attacks: 03-offensive/web-injection.md
      - XSS, CSRF & SSRF: 03-offensive/web-xss-csrf-ssrf.md
  - "Phase 4 — Specializations": 04-specializations/index.md
  - "Phase 5 — Defense": 05-defense/index.md
  - "Phase 6 — Career": 06-career/index.md
  - Appendix: 99-appendix/index.md
