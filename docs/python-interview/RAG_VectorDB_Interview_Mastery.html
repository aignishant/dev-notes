var QDB=[
// Ch1: RAG Fundamentals (12 Qs)
{id:"q1",ch:"ch1",title:"What is RAG? Explain the architecture end-to-end.",body:`<h4>RAG = Retrieval-Augmented Generation</h4><p>A pattern that enhances LLM responses by <strong>retrieving relevant information</strong> from an external knowledge base before generating an answer.</p><h4>End-to-End Pipeline</h4><ol><li><strong>Ingestion (Offline):</strong> Documents → Chunking → Embedding → Store in Vector DB</li><li><strong>Retrieval (Online):</strong> User query → Embed query → Search vector DB → Get top-K relevant chunks</li><li><strong>Augmentation:</strong> Insert retrieved chunks into prompt as context</li><li><strong>Generation:</strong> LLM generates answer grounded in retrieved context</li></ol><pre><code># Simplified RAG pipeline
# 1. Ingestion
chunks = split_documents(docs, chunk_size=512)
embeddings = embed_model.encode(chunks)
vector_db.add(embeddings, chunks)

# 2. Retrieval + Generation
query_embedding = embed_model.encode(user_query)
relevant_chunks = vector_db.search(query_embedding, top_k=5)
prompt = f"Context: {relevant_chunks}\\nQuestion: {user_query}\\nAnswer:"
answer = llm.generate(prompt)</code></pre><div class="scenario"><div class="scenario-tag">🎯 Interview Scenario</div><p><strong>"Why use RAG instead of just fine-tuning the LLM on your data?"</strong></p><p><strong>Answer:</strong> RAG is preferred when: (1) Knowledge changes frequently — updating a vector DB takes minutes vs retraining takes hours/days, (2) You need source attribution — RAG can cite which documents informed the answer, (3) Cost — RAG adds no training cost, just inference + retrieval, (4) Factual accuracy — fine-tuning can hallucinate "learned" facts, RAG grounds in actual documents, (5) Data privacy — documents stay in your DB, not baked into model weights. Use fine-tuning only when you need to change the model's behavior/style, not just its knowledge.</p></div>`},

{id:"q2",ch:"ch1",title:"Why does RAG reduce hallucination compared to using LLM alone?",body:`<h4>Without RAG</h4><p>LLM relies on compressed knowledge from pre-training. This knowledge can be outdated, incomplete, or incorrectly memorized. The model generates plausible-sounding but potentially false information.</p><h4>With RAG</h4><ul><li><strong>Evidence-based:</strong> Answer is generated from actual retrieved documents, not memory</li><li><strong>Verifiable:</strong> Can check if the answer matches the source documents</li><li><strong>Current:</strong> Knowledge base can be updated in real-time without retraining</li><li><strong>Constrained:</strong> System prompt tells model to "only answer from provided context"</li></ul><h4>Limitations</h4><p>RAG doesn't eliminate hallucination completely. The LLM can still: ignore the context, misinterpret context, or generate claims not in the context. Multi-layer verification is needed.</p>`},

{id:"q3",ch:"ch1",title:"RAG vs Fine-tuning vs Long Context — when to use each?",body:`<table><thead><tr><th>Approach</th><th>Best For</th><th>Limitations</th></tr></thead><tbody><tr><td><strong>RAG</strong></td><td>Dynamic knowledge, source citation, large corpora, frequent updates</td><td>Retrieval quality bottleneck, latency overhead</td></tr><tr><td><strong>Fine-tuning</strong></td><td>Changing model behavior/style, domain-specific language, consistent format</td><td>Expensive, can hallucinate, doesn't add factual knowledge reliably</td></tr><tr><td><strong>Long Context</strong></td><td>Small document sets (<100 pages), when ALL context is needed</td><td>Expensive per query, "lost in the middle," context length limits</td></tr></tbody></table><h4>Hybrid Approaches</h4><ul><li><strong>Fine-tune + RAG:</strong> Fine-tune for domain language/format, RAG for factual knowledge</li><li><strong>RAG + Long Context:</strong> Retrieve relevant docs, stuff them into a long context window</li></ul>`},

{id:"q4",ch:"ch1",title:"What are the components of a RAG system? Explain each.",body:`<ol><li><strong>Document Loader:</strong> Ingest PDFs, HTML, databases, APIs into raw text. Tools: LangChain loaders, Unstructured.io, LlamaParse.</li><li><strong>Text Splitter (Chunker):</strong> Break documents into smaller chunks. Critical for retrieval quality.</li><li><strong>Embedding Model:</strong> Convert text chunks into dense vectors. OpenAI text-embedding-3, BGE, E5, GTE.</li><li><strong>Vector Store:</strong> Index and search embeddings. Pinecone, Weaviate, Qdrant, ChromaDB, pgvector.</li><li><strong>Retriever:</strong> Find relevant chunks for a query. Semantic search, keyword search, or hybrid.</li><li><strong>Reranker (optional):</strong> Re-score retrieved chunks with a cross-encoder for better precision. Cohere Rerank, BGE-Reranker.</li><li><strong>Prompt Template:</strong> Format context + query for the LLM.</li><li><strong>LLM:</strong> Generate the final answer from retrieved context.</li></ol>`},

{id:"q5",ch:"ch1",title:"What is the difference between naive RAG and advanced RAG?",body:`<h4>Naive RAG</h4><p>Simple pipeline: chunk → embed → retrieve top-K → generate. No optimization at any stage.</p><h4>Problems with Naive RAG</h4><ul><li>Poor chunking splits sentences mid-thought</li><li>Single embedding model misses keyword matches</li><li>Top-K retrieval without reranking returns irrelevant chunks</li><li>No query understanding — ambiguous queries get poor results</li></ul><h4>Advanced RAG</h4><ul><li><strong>Pre-retrieval:</strong> Query rewriting, HyDE, multi-query expansion</li><li><strong>Retrieval:</strong> Hybrid search (semantic + keyword), reranking, metadata filtering</li><li><strong>Post-retrieval:</strong> Context compression, lost-in-middle mitigation, citation extraction</li><li><strong>Generation:</strong> Faithfulness checking, answer verification</li></ul>`},

{id:"q6",ch:"ch1",title:"What is the indexing pipeline? How do you prepare documents for RAG?",body:`<ol><li><strong>Load:</strong> Parse various formats (PDF, DOCX, HTML, Markdown, databases)</li><li><strong>Clean:</strong> Remove boilerplate (headers, footers, navigation), fix encoding, normalize whitespace</li><li><strong>Chunk:</strong> Split into appropriately sized segments with overlap</li><li><strong>Enrich:</strong> Add metadata (source, date, section title, page number)</li><li><strong>Embed:</strong> Convert chunks to vectors using embedding model</li><li><strong>Store:</strong> Index in vector database with metadata</li></ol>`},

{id:"q7",ch:"ch1",title:"What is semantic search? How does it differ from keyword search?",body:`<table><thead><tr><th>Aspect</th><th>Keyword Search (BM25/TF-IDF)</th><th>Semantic Search (Embeddings)</th></tr></thead><tbody><tr><td>Matching</td><td>Exact/fuzzy word matches</td><td>Meaning-based similarity</td></tr><tr><td>"car" query finds</td><td>Documents containing "car"</td><td>Documents about "automobile," "vehicle," "driving"</td></tr><tr><td>Strengths</td><td>Exact names, acronyms, IDs, codes</td><td>Synonyms, paraphrases, concepts</td></tr><tr><td>Weaknesses</td><td>Misses synonyms and paraphrases</td><td>Can miss exact keyword matches</td></tr></tbody></table><div class="scenario"><div class="scenario-tag">🎯 Interview Scenario</div><p><strong>"A user searches for 'PTO policy' but the document says 'vacation and leave guidelines.' Your semantic search finds it. But when they search for 'Form W-2,' semantic search returns irrelevant HR documents. How do you fix this?"</strong></p><p><strong>Answer:</strong> Use hybrid search combining both. Semantic search handles natural language queries ("PTO policy" → "vacation guidelines"), while keyword search (BM25) handles exact matches ("Form W-2"). Implement with RRF (Reciprocal Rank Fusion) to merge results from both. This gives the best of both worlds.</p></div>`},

{id:"q8",ch:"ch1",title:"What is the role of the prompt template in RAG?",body:`<pre><code># Standard RAG prompt template
SYSTEM_PROMPT = """You are a helpful assistant. Answer the user's question
based ONLY on the provided context. If the answer is not in the context,
say "I don't have information about that."

Do not make up information. Cite the source document when possible.

Context:
{retrieved_chunks}
"""

USER_PROMPT = "{user_question}"</code></pre><h4>Key Elements</h4><ul><li><strong>Grounding instruction:</strong> "Only answer from context" — prevents hallucination</li><li><strong>"I don't know" instruction:</strong> Explicitly tell the model it's OK to not answer</li><li><strong>Citation instruction:</strong> Ask for source references</li><li><strong>Context placement:</strong> Put most relevant chunks first (lost-in-the-middle mitigation)</li></ul>`},

{id:"q9",ch:"ch1",title:"What is the difference between open-domain and closed-domain RAG?",body:`<ul><li><strong>Open-domain:</strong> Knowledge base covers broad topics (Wikipedia, web). User can ask anything. Challenge: retrieval precision from massive corpus.</li><li><strong>Closed-domain:</strong> Knowledge base is specific (company docs, product manuals, legal contracts). User questions are within scope. Challenge: handling out-of-scope questions gracefully.</li></ul>`},

{id:"q10",ch:"ch1",title:"What is GraphRAG? Knowledge graphs for RAG.",body:`<h4>Concept</h4><p>Instead of (or in addition to) vector search, use a <strong>knowledge graph</strong> to retrieve structured relationships between entities.</p><h4>How It Works</h4><ol><li>Extract entities and relationships from documents (NER + relation extraction)</li><li>Build a knowledge graph (nodes = entities, edges = relationships)</li><li>For a query, identify relevant entities → traverse graph → retrieve connected information</li><li>Combine graph context with traditional RAG chunks for generation</li></ol><h4>When to Use</h4><ul><li>Questions about relationships ("Who reports to the VP of Engineering?")</li><li>Multi-hop reasoning ("What products does the subsidiary of Company X sell?")</li><li>When entities are densely connected (organizational charts, product catalogs)</li></ul>`},

{id:"q11",ch:"ch1",title:"What is multimodal RAG? Handling images, tables, and structured data.",body:`<h4>Challenges</h4><p>Standard RAG only handles text. But documents contain tables, charts, diagrams, and images with critical information.</p><h4>Approaches</h4><ul><li><strong>Table extraction:</strong> Parse tables into structured format (HTML/markdown), embed as text</li><li><strong>Image captioning:</strong> Use vision model (GPT-4V, LLaVA) to generate text descriptions of images → embed descriptions</li><li><strong>Multi-modal embeddings:</strong> Use CLIP or SigLIP to embed images and text in the same space</li><li><strong>Document layout parsing:</strong> Preserve document structure (Unstructured.io, LlamaParse)</li></ul>`},

{id:"q12",ch:"ch1",title:"RAG vs fine-tuning: complete comparison table.",body:`<table><thead><tr><th>Dimension</th><th>RAG</th><th>Fine-tuning</th></tr></thead><tbody><tr><td>Knowledge update</td><td>Minutes (update DB)</td><td>Hours/days (retrain)</td></tr><tr><td>Cost</td><td>Retrieval infra + LLM per query</td><td>Training compute + labeled data</td></tr><tr><td>Hallucination</td><td>Lower (grounded in docs)</td><td>Can hallucinate "learned" facts</td></tr><tr><td>Citation</td><td>Can cite sources</td><td>No source attribution</td></tr><tr><td>Privacy</td><td>Data in your DB</td><td>Data baked into weights</td></tr><tr><td>Behavior change</td><td>Limited (prompt only)</td><td>Deep behavior change</td></tr><tr><td>Latency</td><td>Higher (retrieval step)</td><td>Lower (no retrieval)</td></tr></tbody></table>`},

// Ch2: Chunking (8 Qs)
{id:"q13",ch:"ch2",title:"Why is chunking important? What happens with bad chunking?",body:`<h4>Why Chunking Matters</h4><p>Embedding models have token limits (512-8192 tokens). Documents must be split into chunks that are: small enough to embed, large enough to contain meaningful information, and aligned with semantic boundaries.</p><h4>Bad Chunking Consequences</h4><ul><li><strong>Too small (50 tokens):</strong> Chunks lack context — "increased 15%" without knowing what increased</li><li><strong>Too large (2000 tokens):</strong> Embeddings become diluted — averaging too many topics into one vector</li><li><strong>Mid-sentence splits:</strong> Half a sentence is meaningless and retrieves incorrectly</li><li><strong>No overlap:</strong> Important info at chunk boundaries is lost</li></ul>`},

{id:"q14",ch:"ch2",title:"Compare chunking strategies: fixed-size, recursive, semantic, document-based.",body:`<table><thead><tr><th>Strategy</th><th>How</th><th>Best For</th></tr></thead><tbody><tr><td><strong>Fixed-size</strong></td><td>Split every N characters/tokens</td><td>Simple, fast, works OK for uniform text</td></tr><tr><td><strong>Recursive character</strong></td><td>Split by \\n\\n, then \\n, then ". ", then " "</td><td>Default choice — respects natural boundaries</td></tr><tr><td><strong>Semantic</strong></td><td>Split when embedding similarity between consecutive sentences drops</td><td>Topic-diverse documents</td></tr><tr><td><strong>Document-based</strong></td><td>Split by document structure (headers, sections)</td><td>Structured docs (manuals, reports)</td></tr><tr><td><strong>Sentence-based</strong></td><td>Split into sentences, group N sentences per chunk</td><td>When sentence integrity is critical</td></tr></tbody></table><pre><code># LangChain recursive splitter (most common)
from langchain.text_splitter import RecursiveCharacterTextSplitter

splitter = RecursiveCharacterTextSplitter(
    chunk_size=512,
    chunk_overlap=50,
    separators=["\\n\\n", "\\n", ". ", " ", ""]
)</code></pre>`},

{id:"q15",ch:"ch2",title:"What is chunk overlap? How much overlap should you use?",body:`<p>Overlap means adjacent chunks share some text at their boundaries. This prevents losing information that spans a chunk boundary.</p><h4>Guidelines</h4><ul><li><strong>Typical:</strong> 10-20% of chunk size (chunk_size=512 → overlap=50-100)</li><li><strong>Too little:</strong> Important cross-boundary information lost</li><li><strong>Too much:</strong> Redundant storage, repeated context in retrieval, higher costs</li></ul>`},

{id:"q16",ch:"ch2",title:"What is semantic chunking? How does it work?",body:`<p>Split text where the <strong>topic changes</strong>, not at fixed intervals. Uses embeddings to detect semantic boundaries.</p><h4>Algorithm</h4><ol><li>Embed each sentence individually</li><li>Compute cosine similarity between consecutive sentence embeddings</li><li>When similarity drops below a threshold → split here (topic changed)</li><li>Group consecutive high-similarity sentences into chunks</li></ol><h4>Advantage</h4><p>Each chunk is semantically coherent — covers one topic. Much better retrieval quality than fixed-size for topic-diverse documents.</p>`},

{id:"q17",ch:"ch2",title:"How do you handle tables, code, and structured data in chunking?",body:`<ul><li><strong>Tables:</strong> Keep entire table as one chunk (don't split mid-row). Convert to markdown or HTML format. Add table caption/header as metadata.</li><li><strong>Code:</strong> Split by function/class boundaries, not mid-function. Preserve indentation and context.</li><li><strong>Lists:</strong> Keep list items with their parent heading. Don't split a list across chunks.</li><li><strong>Metadata:</strong> Attach section title, page number, document name to each chunk — helps with filtering and citation.</li></ul>`},

{id:"q18",ch:"ch2",title:"What is parent-child chunking (hierarchical chunking)?",body:`<h4>Concept</h4><p>Create <strong>small chunks for retrieval</strong> (precise matching) but return the <strong>larger parent chunk for context</strong> (complete information).</p><h4>Implementation</h4><ol><li>Split documents into large chunks (parent: 2000 tokens)</li><li>Split each parent into small chunks (child: 200 tokens)</li><li>Embed and index only child chunks</li><li>When a child chunk matches, return its parent chunk to the LLM</li></ol><h4>Benefits</h4><ul><li>Small chunks → precise semantic matching</li><li>Large parent → complete context for generation</li><li>Best of both worlds</li></ul>`},

{id:"q19",ch:"ch2",title:"What chunk size should you use? How do you determine the optimal size?",body:`<h4>Guidelines</h4><ul><li><strong>256-512 tokens:</strong> Good for precise Q&A, factual retrieval</li><li><strong>512-1024 tokens:</strong> Good balance for most use cases</li><li><strong>1024-2048 tokens:</strong> Better for summarization, complex topics</li></ul><h4>How to Optimize</h4><ol><li>Create a test set of 50-100 query-answer pairs</li><li>Try chunk sizes: 256, 512, 1024, 2048</li><li>Measure retrieval quality (is the answer in the top-K chunks?)</li><li>Pick the size with best retrieval recall at your K</li></ol>`},

{id:"q20",ch:"ch2",title:"What is contextual chunking? Adding context to each chunk.",body:`<p>Each chunk is enriched with <strong>surrounding context</strong> that might be lost after splitting.</p><h4>Techniques</h4><ul><li><strong>Prepend section title:</strong> "Section: Employee Benefits\\n" + chunk content</li><li><strong>Add document summary:</strong> Brief document summary prepended to each chunk</li><li><strong>Contextual embeddings (Anthropic approach):</strong> Use LLM to generate a short context description for each chunk, prepend it before embedding</li></ul><pre><code># Anthropic's contextual retrieval approach
for chunk in chunks:
    context = llm.generate(
        f"Given this document: {doc_summary}\\n"
        f"Describe the context of this chunk: {chunk}"
    )
    enriched_chunk = f"{context}\\n{chunk}"
    embedding = embed(enriched_chunk)</code></pre>`},

// Ch3: Embeddings (8 Qs)
{id:"q21",ch:"ch3",title:"What are text embeddings? How do embedding models work?",body:`<h4>Definition</h4><p>Dense vector representations of text where <strong>semantically similar texts have vectors close together</strong> in the embedding space.</p><h4>How They're Trained</h4><ul><li><strong>Contrastive learning:</strong> Train model so similar texts (question-answer pairs) have close embeddings and dissimilar texts have distant embeddings</li><li><strong>Architecture:</strong> Typically a transformer encoder (BERT-based) with mean pooling of token embeddings</li></ul><h4>Properties</h4><ul><li>Fixed dimensionality (768, 1024, 1536, or 3072)</li><li>Similarity measured by cosine similarity or dot product</li><li>Capture semantic meaning, not just word overlap</li></ul>`},

{id:"q22",ch:"ch3",title:"Compare embedding models: OpenAI, Cohere, BGE, E5, GTE.",body:`<table><thead><tr><th>Model</th><th>Dims</th><th>Max Tokens</th><th>Notes</th></tr></thead><tbody><tr><td>OpenAI text-embedding-3-small</td><td>1536</td><td>8191</td><td>Good quality, API-only, cost per token</td></tr><tr><td>OpenAI text-embedding-3-large</td><td>3072</td><td>8191</td><td>Best quality from OpenAI</td></tr><tr><td>Cohere embed-v3</td><td>1024</td><td>512</td><td>Multilingual, search-optimized</td></tr><tr><td>BGE-large-en-v1.5</td><td>1024</td><td>512</td><td>Open-source, MTEB top performer</td></tr><tr><td>E5-large-v2</td><td>1024</td><td>512</td><td>Open-source, instruction-tuned</td></tr><tr><td>GTE-large</td><td>1024</td><td>512</td><td>Alibaba, strong on benchmarks</td></tr><tr><td>Nomic embed-text-v1.5</td><td>768</td><td>8192</td><td>Open-source, long context, Matryoshka</td></tr></tbody></table><h4>How to Choose</h4><ul><li><strong>API convenience + best quality:</strong> OpenAI text-embedding-3</li><li><strong>Self-hosted + privacy:</strong> BGE, E5, or GTE</li><li><strong>Multilingual:</strong> Cohere embed-v3 or multilingual-e5</li><li><strong>Long documents:</strong> Nomic or OpenAI (8K tokens)</li></ul>`},

{id:"q23",ch:"ch3",title:"What is cosine similarity? How is it used for retrieval?",body:`<p><code>cos(A, B) = (A · B) / (||A|| × ||B||)</code></p><p>Measures the angle between two vectors, ignoring magnitude. Range: -1 (opposite) to +1 (identical direction).</p><h4>Why Cosine over Euclidean?</h4><ul><li>Cosine is <strong>scale-invariant</strong> — a long document and a short query can still match well</li><li>Most embedding models are normalized, so cosine similarity = dot product (faster computation)</li><li>Euclidean distance is affected by vector magnitude, not just direction</li></ul>`},

{id:"q24",ch:"ch3",title:"What is the MTEB benchmark? How do you evaluate embedding models?",body:`<p><strong>Massive Text Embedding Benchmark</strong> — evaluates embedding models across 56+ datasets covering: retrieval, classification, clustering, reranking, STS (Semantic Textual Similarity), and summarization.</p><h4>Why It Matters</h4><p>An embedding model that's great for classification might be poor for retrieval. MTEB tests across tasks so you can choose based on YOUR use case.</p><h4>Key Insight</h4><p>MTEB leaderboard changes frequently. Always check the latest results and filter by your specific task (retrieval) rather than overall average score.</p>`},

{id:"q25",ch:"ch3",title:"What is instruction-tuned embedding? Why prefix instructions matter.",body:`<p>Some embedding models (E5, BGE) are trained with <strong>task-specific prefixes</strong> that tell the model what kind of embedding to produce.</p><pre><code># E5 model requires prefixes
query_embedding = embed("query: What is machine learning?")
doc_embedding = embed("passage: Machine learning is a branch of AI...")

# BGE model
query_embedding = embed("Represent this sentence for searching: What is ML?")
doc_embedding = embed("Machine learning is a branch of AI...")</code></pre><h4>Why It Helps</h4><p>Queries and documents are fundamentally different types of text. A question ("What is ML?") and its answer ("ML is a branch of AI...") look very different lexically. Instruction prefixes help the model produce embeddings optimized for asymmetric retrieval.</p>`},

{id:"q26",ch:"ch3",title:"What is Matryoshka embedding? Why is it useful?",body:`<p>Embedding models trained so that <strong>truncating the vector to fewer dimensions</strong> still produces a useful embedding. Named after Russian nesting dolls.</p><h4>Example</h4><p>A 1024-dim embedding can be truncated to 256-dim with only slight quality loss (5% degradation vs 75% storage savings).</p><h4>Benefits</h4><ul><li>Reduce storage costs by 4-8x</li><li>Faster similarity search (smaller vectors)</li><li>Flexible: use full dimensions for high-precision, truncated for speed/cost</li></ul>`},

{id:"q27",ch:"ch3",title:"What is the difference between bi-encoder and cross-encoder?",body:`<table><thead><tr><th>Aspect</th><th>Bi-Encoder</th><th>Cross-Encoder</th></tr></thead><tbody><tr><td>Architecture</td><td>Embed query and doc separately</td><td>Process query+doc together</td></tr><tr><td>Speed</td><td>Fast (pre-compute doc embeddings)</td><td>Slow (compute per query-doc pair)</td></tr><tr><td>Quality</td><td>Good</td><td>Better (sees interactions)</td></tr><tr><td>Use in RAG</td><td>First-stage retrieval (search millions)</td><td>Second-stage reranking (rerank top-20)</td></tr></tbody></table><h4>Two-Stage Pipeline</h4><ol><li><strong>Stage 1 (Bi-encoder):</strong> Fast retrieval of top-100 candidates from millions of documents</li><li><strong>Stage 2 (Cross-encoder):</strong> Accurate reranking of top-100 → select best 5-10</li></ol>`},

{id:"q28",ch:"ch3",title:"How do you handle embedding model changes? Re-embedding strategies.",body:`<p>When you upgrade your embedding model (e.g., from text-embedding-ada-002 to text-embedding-3-small), <strong>all existing embeddings become incompatible</strong>.</p><h4>Strategies</h4><ul><li><strong>Full re-embedding:</strong> Re-embed entire corpus. Clean but expensive for large datasets.</li><li><strong>Gradual migration:</strong> Run both old and new indexes in parallel. Migrate in batches.</li><li><strong>Version-tagged embeddings:</strong> Store model version with each embedding. Route queries to matching index.</li></ul><h4>Prevention</h4><p>Store raw text alongside embeddings so re-embedding is always possible. Treat embedding model as a dependency that may change.</p>`},

// Ch4: Vector Databases (8 Qs)
{id:"q29",ch:"ch4",title:"What is a vector database? How is it different from a traditional database?",body:`<h4>Traditional DB</h4><p>Stores structured data, queries by exact match or range: <code>SELECT * WHERE age > 30</code></p><h4>Vector DB</h4><p>Stores high-dimensional vectors, queries by <strong>similarity</strong>: "Find the 10 vectors most similar to this query vector."</p><h4>Key Operations</h4><ul><li><strong>Insert:</strong> Add vector + metadata + optional payload</li><li><strong>Search:</strong> Find top-K nearest neighbors by cosine/dot product/euclidean distance</li><li><strong>Filter:</strong> Combine similarity search with metadata filters ("similar vectors WHERE category='tech'")</li><li><strong>Update/Delete:</strong> Modify or remove vectors</li></ul>`},

{id:"q30",ch:"ch4",title:"Compare vector databases: Pinecone, Weaviate, Qdrant, Milvus, ChromaDB, pgvector.",body:`<table><thead><tr><th>DB</th><th>Type</th><th>Best For</th></tr></thead><tbody><tr><td><strong>Pinecone</strong></td><td>Managed cloud</td><td>Zero-ops production, enterprise</td></tr><tr><td><strong>Weaviate</strong></td><td>Open-source + cloud</td><td>Hybrid search (vector + keyword), multimodal</td></tr><tr><td><strong>Qdrant</strong></td><td>Open-source + cloud</td><td>High performance, rich filtering, Rust-based</td></tr><tr><td><strong>Milvus</strong></td><td>Open-source</td><td>Billion-scale, GPU-accelerated</td></tr><tr><td><strong>ChromaDB</strong></td><td>Open-source</td><td>Local development, prototyping, simple API</td></tr><tr><td><strong>pgvector</strong></td><td>PostgreSQL extension</td><td>Teams already using Postgres, simple setup</td></tr><tr><td><strong>FAISS</strong></td><td>Library (not DB)</td><td>Research, maximum speed, in-memory</td></tr></tbody></table>`},

{id:"q31",ch:"ch4",title:"What is ANN (Approximate Nearest Neighbor) search? HNSW vs IVF.",body:`<h4>Why Approximate?</h4><p>Exact nearest neighbor in high dimensions is O(n×d) — too slow for millions of vectors. ANN trades slight accuracy for massive speedup.</p><h4>HNSW (Hierarchical Navigable Small World)</h4><ul><li>Graph-based: builds multi-layer navigable graph</li><li>Best accuracy/speed trade-off for most cases</li><li>Higher memory usage (stores graph structure)</li><li>Used by: Qdrant, Weaviate, pgvector (default), most vector DBs</li></ul><h4>IVF (Inverted File Index)</h4><ul><li>Partition-based: clusters vectors, searches only relevant clusters</li><li>Lower memory than HNSW</li><li>Good for very large datasets (billions)</li><li>Used by: FAISS, Milvus</li></ul><h4>Product Quantization (PQ)</h4><ul><li>Compress vectors to use less memory</li><li>Trade-off: lower accuracy for 4-8x memory reduction</li><li>Often combined with IVF: IVF-PQ for billion-scale search</li></ul>`},

{id:"q32",ch:"ch4",title:"What is metadata filtering in vector search? Why is it important?",body:`<p>Combine similarity search with <strong>structured filters</strong> on metadata fields.</p><pre><code># Qdrant example: semantic search + metadata filter
results = client.search(
    collection_name="documents",
    query_vector=query_embedding,
    query_filter=Filter(
        must=[
            FieldCondition(key="department", match=MatchValue(value="engineering")),
            FieldCondition(key="year", range=Range(gte=2023))
        ]
    ),
    limit=5
)</code></pre><h4>Use Cases</h4><ul><li>Multi-tenant: filter by tenant_id (data isolation)</li><li>Access control: filter by permission level</li><li>Temporal: only search recent documents</li><li>Domain: filter by category, department, document type</li></ul>`},

{id:"q33",ch:"ch4",title:"How do you scale vector databases for millions of documents?",body:`<ul><li><strong>Sharding:</strong> Distribute vectors across multiple nodes</li><li><strong>Quantization:</strong> Compress vectors (scalar, product quantization) — 4-8x memory savings</li><li><strong>Disk-based indexes:</strong> Keep frequently accessed vectors in memory, rest on disk</li><li><strong>Tiered storage:</strong> Hot (memory) → warm (SSD) → cold (HDD/S3)</li><li><strong>Pre-filtering:</strong> Reduce search space with metadata filters before ANN search</li></ul>`},

{id:"q34",ch:"ch4",title:"When should you use pgvector vs a dedicated vector database?",body:`<h4>Use pgvector When:</h4><ul><li>Already using PostgreSQL</li><li>Small-medium scale (<1M vectors)</li><li>Need ACID transactions alongside vector search</li><li>Want to avoid additional infrastructure</li><li>Metadata queries are complex (JOINs with other tables)</li></ul><h4>Use Dedicated Vector DB When:</h4><ul><li>Scale beyond 10M vectors</li><li>Need sub-10ms latency at scale</li><li>Advanced ANN algorithms (HNSW tuning, quantization)</li><li>Hybrid search (vector + full-text) is core requirement</li></ul>`},

{id:"q35",ch:"ch4",title:"What is hybrid search? Combining keyword and semantic search.",body:`<h4>Why Hybrid?</h4><p>Semantic search misses exact keywords. Keyword search misses synonyms. Combining both gives the best results.</p><h4>Implementation</h4><ol><li>Run BM25 keyword search → get ranked list A</li><li>Run semantic vector search → get ranked list B</li><li>Merge with Reciprocal Rank Fusion (RRF): <code>score = Σ 1/(k + rank_i)</code></li></ol><pre><code># Weaviate hybrid search
results = client.query.get("Document", ["content", "title"]).with_hybrid(
    query="machine learning deployment",
    alpha=0.7  # 0=keyword only, 1=semantic only, 0.7=mostly semantic
).with_limit(10).do()</code></pre>`},

{id:"q36",ch:"ch4",title:"What are vector database indexes? How do you tune them?",body:`<h4>HNSW Parameters</h4><ul><li><strong>ef_construction:</strong> Controls index quality during build. Higher = better quality, slower indexing. Typical: 128-512.</li><li><strong>M:</strong> Number of connections per node. Higher = better recall, more memory. Typical: 16-64.</li><li><strong>ef_search:</strong> Controls search quality at query time. Higher = better recall, slower search. Typical: 64-256.</li></ul><h4>Tuning Strategy</h4><ol><li>Build index with high ef_construction (one-time cost)</li><li>Tune ef_search at query time for latency/recall trade-off</li><li>Benchmark: measure recall@10 at different ef_search values vs latency</li></ol>`},

// Ch5: Retrieval Strategies (6 Qs)
{id:"q37",ch:"ch5",title:"What is query expansion? Multi-query and HyDE techniques.",body:`<h4>Problem</h4><p>User queries are often short, ambiguous, or use different terminology than the documents.</p><h4>Multi-Query</h4><p>Generate multiple reformulated versions of the user query using an LLM, retrieve for each, merge results.</p><pre><code># Multi-query generation
original = "What's the vacation policy?"
generated_queries = llm.generate(
    f"Generate 3 different versions of: '{original}'"
)
# → ["PTO policy", "time off guidelines", "leave entitlement rules"]
# Search with all queries, merge and deduplicate results</code></pre><h4>HyDE (Hypothetical Document Embeddings)</h4><p>Generate a <strong>hypothetical answer</strong> to the query, embed the answer instead of the query. The hypothetical answer is closer in embedding space to actual relevant documents than the short query.</p>`},

{id:"q38",ch:"ch5",title:"What is reranking? How does it improve retrieval quality?",body:`<h4>Problem</h4><p>Bi-encoder retrieval (vector search) is fast but not the most accurate. Top-20 results often contain irrelevant chunks mixed with relevant ones.</p><h4>Solution: Cross-Encoder Reranking</h4><ol><li>Retrieve top-20-50 candidates with fast bi-encoder search</li><li>Score each candidate with a cross-encoder (processes query + document together)</li><li>Rerank by cross-encoder scores, keep top-5</li></ol><h4>Reranker Models</h4><ul><li><strong>Cohere Rerank:</strong> API-based, best quality, easy to use</li><li><strong>BGE-Reranker:</strong> Open-source, good quality</li><li><strong>ColBERT:</strong> Token-level interaction, fast reranking</li><li><strong>FlashRank:</strong> Lightweight, CPU-friendly</li></ul><p><strong>Impact:</strong> Reranking typically improves RAG answer quality by 10-30%.</p>`},

{id:"q39",ch:"ch5",title:"What is self-query retrieval? LLM-generated metadata filters.",body:`<p>The LLM parses the user query into a <strong>semantic search query + structured metadata filters</strong> automatically.</p><pre><code># User query: "Show me HR policies from 2024 about remote work"
# LLM self-query output:
{
    "search_query": "remote work policy",
    "filters": {
        "department": "HR",
        "year": 2024,
        "document_type": "policy"
    }
}</code></pre><h4>Benefits</h4><ul><li>Users can query naturally without knowing the filter syntax</li><li>Combines semantic search with precise metadata filtering</li><li>Much better precision for structured queries</li></ul>`},

{id:"q40",ch:"ch5",title:"What is contextual compression? Reducing noise in retrieved chunks.",body:`<p>Retrieved chunks often contain irrelevant sentences alongside relevant ones. Contextual compression <strong>extracts only the relevant parts</strong> before sending to the LLM.</p><h4>Techniques</h4><ul><li><strong>LLM-based extraction:</strong> Ask LLM to extract only sentences relevant to the query</li><li><strong>Sentence-level filtering:</strong> Score each sentence for relevance, keep only high-scoring ones</li><li><strong>EmbedChain-style:</strong> Re-embed each sentence, filter by similarity to query</li></ul><h4>Benefits</h4><ul><li>Less noise in the context → more accurate answers</li><li>Fewer tokens → lower cost and latency</li><li>Fits more relevant info within context window</li></ul>`},

{id:"q41",ch:"ch5",title:"What is multi-index retrieval? Searching across multiple sources.",body:`<p>Real applications often need to search across multiple knowledge sources: product docs, FAQs, support tickets, Confluence pages, Slack messages.</p><h4>Approaches</h4><ul><li><strong>Single merged index:</strong> Combine all sources into one vector DB with source metadata</li><li><strong>Multiple indexes + merge:</strong> Search each index separately, merge results with RRF</li><li><strong>Router-based:</strong> Classify query intent, route to appropriate index</li></ul>`},

{id:"q42",ch:"ch5",title:"What is the retrieval-generation gap? When retrieval succeeds but generation fails.",body:`<p>Sometimes the correct information IS retrieved but the LLM still generates a wrong answer.</p><h4>Causes</h4><ul><li><strong>Lost in the middle:</strong> Relevant info buried among irrelevant chunks</li><li><strong>Contradictory chunks:</strong> Retrieved chunks disagree, LLM picks wrong one</li><li><strong>Complex reasoning:</strong> Answer requires multi-hop reasoning across chunks</li><li><strong>Poor prompt:</strong> LLM isn't instructed to use the context properly</li></ul><h4>Solutions</h4><ul><li>Put most relevant chunks first (reranking helps)</li><li>Reduce noise (contextual compression)</li><li>Better prompt engineering ("Base your answer ONLY on...")</li><li>Chain-of-thought in generation</li></ul>`},

// Ch6: Advanced RAG (8 Qs)
{id:"q43",ch:"ch6",title:"What is Corrective RAG (CRAG)?",body:`<p>After retrieval, <strong>evaluate whether the retrieved documents are relevant</strong>. If not, trigger alternative retrieval strategies.</p><h4>Process</h4><ol><li>Retrieve documents with standard RAG</li><li>Use a relevance classifier to score each document</li><li>If relevant → generate answer from retrieved docs</li><li>If ambiguous → refine query and search again</li><li>If irrelevant → fall back to web search or say "I don't know"</li></ol>`},

{id:"q44",ch:"ch6",title:"What is Self-RAG? The model decides when to retrieve.",body:`<p>Standard RAG always retrieves. Self-RAG trains the LLM to <strong>decide when retrieval is needed</strong> and to <strong>evaluate its own outputs</strong> for factuality.</p><h4>Process</h4><ol><li>Model generates initial response</li><li>Model evaluates: "Do I need more information?"</li><li>If yes → retrieve, incorporate new info, regenerate</li><li>Model evaluates: "Is my response supported by the retrieved evidence?"</li><li>If not → revise or retrieve again</li></ol>`},

{id:"q45",ch:"ch6",title:"What is hypothetical document embeddings (HyDE)?",body:`<p>Instead of embedding the short user query, generate a <strong>hypothetical answer</strong> with the LLM, then embed that answer for retrieval.</p><h4>Why It Works</h4><p>A query like "What is photosynthesis?" is very different from a passage explaining photosynthesis. But a hypothetical answer to that question will be very similar to actual passages about photosynthesis. This bridges the query-document gap.</p><pre><code># HyDE implementation
query = "What is photosynthesis?"
hypothetical_doc = llm.generate(
    f"Write a short paragraph answering: {query}"
)
# Embed the hypothetical document, NOT the query
search_embedding = embed_model.encode(hypothetical_doc)
results = vector_db.search(search_embedding, top_k=5)</code></pre>`},

{id:"q46",ch:"ch6",title:"What is Agentic RAG? How do agents improve retrieval?",body:`<p>Instead of a fixed retrieval pipeline, an <strong>LLM agent</strong> decides: what to search, when to search, whether results are sufficient, and when to refine the query.</p><h4>Agent RAG vs Traditional RAG</h4><ul><li><strong>Traditional:</strong> Always retrieve, fixed top-K, single query</li><li><strong>Agentic:</strong> Decides IF retrieval needed, WHAT to search, searches MULTIPLE times with refined queries, evaluates sufficiency</li></ul>`},

{id:"q47",ch:"ch6",title:"What is late-interaction retrieval? ColBERT explained.",body:`<h4>Problem with Standard Bi-Encoders</h4><p>Query and document are compressed into single vectors. Fine-grained token-level interactions are lost.</p><h4>ColBERT: Late Interaction</h4><p>Store per-token embeddings for documents. At query time, compute maximum similarity between each query token and all document tokens.</p><h4>Benefits</h4><ul><li>Much better retrieval quality than standard bi-encoders</li><li>Still faster than cross-encoders (token embeddings are pre-computed)</li><li>Trade-off: more storage (per-token vectors vs single vector)</li></ul>`},

{id:"q48",ch:"ch6",title:"What is RAPTOR? Recursive abstractive processing for tree-organized retrieval.",body:`<p>Build a <strong>tree of summaries</strong> from document chunks. Leaves are original chunks, parent nodes are summaries of children, root is a summary of the entire document.</p><h4>Retrieval</h4><p>Search at multiple levels: find relevant summaries (high-level context) AND relevant chunks (specific details). Provides both detailed and contextual information.</p>`},

{id:"q49",ch:"ch6",title:"What is query routing? Directing queries to the right data source.",body:`<p>Not all queries should go to the same index. A router classifies the query and directs it to the appropriate retrieval source.</p><ul><li>Product question → Product docs index</li><li>Billing question → Billing FAQ index</li><li>Technical issue → Support ticket index + Knowledge base</li><li>General question → Web search fallback</li></ul>`},

{id:"q50",ch:"ch6",title:"What is recursive retrieval? Multi-hop RAG for complex questions.",body:`<p>Some questions require information from multiple documents that need to be combined. Recursive retrieval retrieves, reasons about what's still missing, retrieves again.</p><pre><code># Multi-hop: "What projects does the CTO's team work on?"
# Step 1: Retrieve → Find CTO name: "Jane Smith"
# Step 2: Retrieve → Find Jane Smith's team members
# Step 3: Retrieve → Find each team member's projects
# Step 4: Synthesize all information into answer</code></pre>`},

// Ch7: Evaluation (6 Qs)
{id:"q51",ch:"ch7",title:"How do you evaluate RAG systems? The RAGAS framework.",body:`<h4>RAGAS Metrics</h4><table><thead><tr><th>Metric</th><th>Measures</th><th>Needs Ground Truth?</th></tr></thead><tbody><tr><td><strong>Faithfulness</strong></td><td>Is the answer supported by the retrieved context?</td><td>No</td></tr><tr><td><strong>Answer Relevancy</strong></td><td>Does the answer address the question?</td><td>No</td></tr><tr><td><strong>Context Precision</strong></td><td>Are retrieved chunks relevant to the question?</td><td>Yes</td></tr><tr><td><strong>Context Recall</strong></td><td>Did we retrieve all necessary information?</td><td>Yes</td></tr></tbody></table><pre><code>from ragas import evaluate
from ragas.metrics import faithfulness, answer_relevancy, context_precision

result = evaluate(
    dataset,
    metrics=[faithfulness, answer_relevancy, context_precision]
)</code></pre>`},

{id:"q52",ch:"ch7",title:"What is retrieval quality? How do you measure Precision@K and Recall@K.",body:`<ul><li><strong>Precision@K:</strong> Of the K retrieved chunks, how many are relevant? High precision = few irrelevant results.</li><li><strong>Recall@K:</strong> Of all relevant chunks in the corpus, how many did we retrieve in top-K? High recall = we found most of the good stuff.</li><li><strong>MRR (Mean Reciprocal Rank):</strong> Average 1/rank of the first relevant result. Measures how early relevant results appear.</li><li><strong>NDCG:</strong> Accounts for the position of relevant results — relevant results higher up are worth more.</li></ul>`},

{id:"q53",ch:"ch7",title:"What is faithfulness evaluation? Detecting hallucination in RAG.",body:`<p>Check if every claim in the generated answer is <strong>supported by the retrieved context</strong>.</p><h4>Process</h4><ol><li>Extract individual claims/statements from the answer</li><li>For each claim, check if it can be inferred from the context</li><li>Faithfulness score = (supported claims) / (total claims)</li></ol><p>Tools: RAGAS, DeepEval, TruLens, custom LLM-as-judge</p>`},

{id:"q54",ch:"ch7",title:"How do you create a RAG evaluation dataset?",body:`<ol><li><strong>Collect real user queries:</strong> Sample from production logs or stakeholder interviews</li><li><strong>Create ground truth:</strong> Human annotators find correct answers and mark relevant source documents</li><li><strong>Synthetic generation:</strong> Use LLM to generate question-answer pairs from documents, then human-verify</li><li><strong>Edge cases:</strong> Include queries with no answer in the corpus, ambiguous queries, multi-hop queries</li><li><strong>Diverse coverage:</strong> Cover all document types, topics, and difficulty levels</li></ol>`},

{id:"q55",ch:"ch7",title:"What is end-to-end vs component-level RAG evaluation?",body:`<h4>Component-Level</h4><ul><li><strong>Retrieval:</strong> Precision@K, Recall@K, MRR — is the right information being found?</li><li><strong>Generation:</strong> Faithfulness, relevance, coherence — is the LLM using context correctly?</li></ul><h4>End-to-End</h4><ul><li><strong>Answer accuracy:</strong> Is the final answer correct? (Compare to ground truth)</li><li><strong>User satisfaction:</strong> Thumbs up/down, explicit ratings</li><li><strong>Task completion:</strong> Did the user find what they needed?</li></ul><p><strong>Key insight:</strong> Good retrieval + good generation doesn't always equal good end-to-end. Evaluate both independently AND together.</p>`},

{id:"q56",ch:"ch7",title:"What is LLM-as-judge for RAG evaluation?",body:`<p>Use a powerful LLM (GPT-4, Claude) to evaluate RAG outputs on multiple dimensions.</p><pre><code># Faithfulness check
prompt = f"""Given this context: {context}
And this answer: {answer}
Is every claim in the answer supported by the context?
Rate faithfulness from 1-5 and explain."""

# Relevancy check
prompt = f"""Question: {question}
Answer: {answer}
Does the answer fully address the question?
Rate relevancy from 1-5."""</code></pre>`},

// Ch8: Production RAG (6 Qs)
{id:"q57",ch:"ch8",title:"How do you deploy RAG in production? Architecture overview.",body:`<ol><li><strong>Ingestion pipeline:</strong> Automated document processing → chunking → embedding → vector DB (triggered by document uploads or scheduled crawls)</li><li><strong>Retrieval service:</strong> API that takes a query, retrieves from vector DB, applies reranking</li><li><strong>Generation service:</strong> LLM with prompt template, context injection, guardrails</li><li><strong>Caching layer:</strong> Semantic cache for repeated/similar queries</li><li><strong>Monitoring:</strong> Retrieval quality, generation quality, latency, cost, user feedback</li><li><strong>Feedback loop:</strong> Collect user ratings → improve retrieval and generation</li></ol>`},

{id:"q58",ch:"ch8",title:"How do you keep a RAG knowledge base up to date?",body:`<ul><li><strong>Incremental indexing:</strong> Detect new/changed documents, re-embed only those (don't re-index everything)</li><li><strong>Webhook triggers:</strong> When a document is updated in CMS/wiki, trigger re-indexing automatically</li><li><strong>Scheduled crawls:</strong> Periodically re-crawl sources for changes</li><li><strong>Version tracking:</strong> Track document hash — only re-embed if content changed</li><li><strong>Deletion handling:</strong> When a document is removed, delete its chunks from vector DB</li></ul>`},

{id:"q59",ch:"ch8",title:"How do you handle multi-tenant RAG? Data isolation.",body:`<h4>Approaches</h4><ul><li><strong>Namespace per tenant:</strong> Single vector DB, separate namespace/collection per tenant. Simple but limited isolation.</li><li><strong>Metadata filtering:</strong> All data in one index with tenant_id metadata. Filter at query time. Most common.</li><li><strong>Separate indexes:</strong> Dedicated vector DB instance per tenant. Maximum isolation, highest cost.</li></ul><h4>Security Considerations</h4><ul><li>Filter must be applied at the DB level, not just application level</li><li>Test that tenant A cannot see tenant B's data</li><li>Audit access logs regularly</li></ul>`},

{id:"q60",ch:"ch8",title:"What is the cost of a RAG system? How do you optimize it?",body:`<h4>Cost Components</h4><ul><li><strong>Embedding:</strong> $0.02-0.13 per 1M tokens (OpenAI) or infrastructure cost for self-hosted</li><li><strong>Vector DB:</strong> $70-500/month for managed (Pinecone), variable for self-hosted</li><li><strong>LLM generation:</strong> $1-60 per 1M tokens depending on model</li><li><strong>Reranking:</strong> $1-2 per 1000 queries (Cohere)</li></ul><h4>Optimization</h4><ul><li>Semantic caching (30-50% LLM cost reduction)</li><li>Matryoshka embeddings (smaller vectors = cheaper storage)</li><li>Quantized vector indexes (4-8x memory savings)</li><li>Model routing (cheap model for simple questions)</li><li>Self-hosted embedding models (BGE, E5) for high volume</li></ul>`},

{id:"q61",ch:"ch8",title:"How do you monitor RAG quality in production?",body:`<ul><li><strong>Retrieval metrics:</strong> Average context relevance score, % of queries with empty retrieval</li><li><strong>Generation metrics:</strong> Faithfulness score (sampled and evaluated), answer relevancy</li><li><strong>User signals:</strong> Thumbs up/down, explicit feedback, follow-up question rate (high = first answer was bad)</li><li><strong>Latency:</strong> Retrieval time, generation time, total response time</li><li><strong>Cost:</strong> Tokens per query, monthly spend trends</li></ul>`},

{id:"q62",ch:"ch8",title:"How do you handle document permissions in RAG?",body:`<h4>Challenge</h4><p>Users should only retrieve documents they have access to. A manager's confidential report shouldn't appear in an intern's search results.</p><h4>Implementation</h4><ul><li><strong>Metadata-based ACL:</strong> Store access groups/roles as metadata. Filter at query time.</li><li><strong>Pre-query permission check:</strong> Resolve user's permissions, include as filter in vector search.</li><li><strong>Post-retrieval filtering:</strong> Check each retrieved document against user's ACL. Less efficient but simpler.</li></ul><pre><code># Permission-aware retrieval
user_groups = get_user_groups(user_id)  # ["engineering", "all-staff"]
results = vector_db.search(
    query_vector=query_embedding,
    filter={"access_groups": {"$in": user_groups}},
    limit=10
)</code></pre>`},

// Ch9: Scenarios (8 Qs)
{id:"q63",ch:"ch9",title:"Scenario: Design a RAG system for internal company documentation.",body:`<h4>Architecture</h4><ol><li><strong>Sources:</strong> Confluence, Google Drive, Notion, Slack → unified ingestion pipeline</li><li><strong>Processing:</strong> LlamaParse for PDFs, custom parsers for wikis, semantic chunking (512 tokens, 50 overlap)</li><li><strong>Embedding:</strong> OpenAI text-embedding-3-small (or BGE for self-hosted privacy)</li><li><strong>Vector DB:</strong> Qdrant or Weaviate with hybrid search</li><li><strong>Retrieval:</strong> Hybrid (BM25 + semantic) + Cohere reranker</li><li><strong>Generation:</strong> GPT-4 / Claude with grounding prompt</li><li><strong>Features:</strong> Source citation, "I don't know" for gaps, access control via user groups</li></ol>`},

{id:"q64",ch:"ch9",title:"Scenario: Your RAG system returns irrelevant results. How do you debug?",body:`<h4>Debugging Checklist</h4><ol><li><strong>Check retrieval independently:</strong> Print the retrieved chunks. Are they relevant to the query? If not, it's a retrieval problem.</li><li><strong>Check chunking:</strong> View the actual chunks in the DB. Are they coherent? Too small? Too large? Split mid-sentence?</li><li><strong>Check embeddings:</strong> Compare the query embedding similarity to relevant vs irrelevant chunks. Is the embedding model working correctly?</li><li><strong>Check query reformulation:</strong> Try rewriting the query manually. Does that improve results? If yes, add query expansion.</li><li><strong>Add reranking:</strong> If top-20 contains relevant chunks but not in top-5, add a cross-encoder reranker.</li><li><strong>Try hybrid search:</strong> If semantic search misses keyword matches, add BM25.</li><li><strong>Check metadata:</strong> Are filters accidentally excluding relevant documents?</li></ol>`},

{id:"q65",ch:"ch9",title:"Scenario: Build a legal document analysis RAG system.",body:`<h4>Unique Challenges</h4><ul><li><strong>Long documents:</strong> Contracts can be 100+ pages</li><li><strong>Precise language matters:</strong> "shall" vs "may" changes legal meaning completely</li><li><strong>Cross-reference:</strong> "As defined in Section 3.2(a)" requires multi-hop retrieval</li><li><strong>Confidentiality:</strong> Client data cannot leave the system</li></ul><h4>Architecture</h4><ul><li><strong>Self-hosted everything:</strong> BGE embeddings, Qdrant on-premise, local LLM (LLaMA/Mistral)</li><li><strong>Document-aware chunking:</strong> Split by sections/clauses, preserve hierarchy</li><li><strong>Cross-reference resolution:</strong> Detect references, link to target sections</li><li><strong>High-precision retrieval:</strong> Reranker + contextual compression</li><li><strong>Always cite sources:</strong> Paragraph number, page, document name in every answer</li><li><strong>Confidence scoring:</strong> Flag low-confidence answers for human review</li></ul>`},

{id:"q66",ch:"ch9",title:"Scenario: Your RAG system is too slow. How do you optimize latency?",body:`<h4>Latency Breakdown</h4><ul><li>Embedding query: 50-100ms</li><li>Vector search: 10-50ms</li><li>Reranking: 100-300ms</li><li>LLM generation: 500ms-5s</li></ul><h4>Optimization</h4><ul><li><strong>Semantic caching:</strong> Cache similar queries → skip everything (10ms)</li><li><strong>Async retrieval:</strong> Start retrieval while user is still typing</li><li><strong>Streaming:</strong> Stream LLM output — user sees first tokens while generation continues</li><li><strong>Reduce top-K:</strong> Retrieve 5 instead of 20 if quality allows</li><li><strong>Skip reranking:</strong> For simple queries, bi-encoder results may be sufficient</li><li><strong>Faster LLM:</strong> Use GPT-3.5 or Mistral 7B instead of GPT-4 for simple queries</li></ul>`},

{id:"q67",ch:"ch9",title:"Scenario: Compare building RAG with LangChain vs LlamaIndex.",body:`<table><thead><tr><th>Aspect</th><th>LangChain</th><th>LlamaIndex</th></tr></thead><tbody><tr><td>Focus</td><td>General LLM application framework</td><td>RAG and data indexing specialist</td></tr><tr><td>Strength</td><td>Chains, agents, broad integrations</td><td>Advanced indexing, retrieval strategies</td></tr><tr><td>RAG features</td><td>Good basics</td><td>More advanced (tree index, knowledge graph, recursive retrieval)</td></tr><tr><td>Flexibility</td><td>More general-purpose</td><td>More opinionated for RAG</td></tr><tr><td>Best for</td><td>RAG + agents + tools + complex apps</td><td>Pure RAG with advanced retrieval needs</td></tr></tbody></table>`},

{id:"q68",ch:"ch9",title:"What are the key RAG anti-patterns to avoid?",body:`<ul><li><strong>Chunking without thought:</strong> Using default 1000 chars without testing optimal size</li><li><strong>Ignoring metadata:</strong> Not storing source, date, section info alongside chunks</li><li><strong>No evaluation:</strong> Deploying without measuring retrieval quality</li><li><strong>Stuffing too much context:</strong> Sending 20 chunks when 3-5 would produce better answers</li><li><strong>No reranking:</strong> Trusting bi-encoder retrieval order blindly</li><li><strong>Static index:</strong> Never updating the knowledge base as documents change</li><li><strong>No fallback:</strong> Not handling "no relevant results found" gracefully</li><li><strong>Ignoring user feedback:</strong> Not collecting and acting on user quality ratings</li></ul>`},

{id:"q69",ch:"ch9",title:"What are the latest trends in RAG (2025)?",body:`<ul><li><strong>Agentic RAG:</strong> Agents decide when/what/how to retrieve — not fixed pipelines</li><li><strong>GraphRAG:</strong> Knowledge graphs for relationship-heavy data</li><li><strong>Multimodal RAG:</strong> Retrieve and reason over text, images, tables together</li><li><strong>Long-context as alternative:</strong> 1M token context windows may replace some RAG use cases</li><li><strong>Contextual retrieval:</strong> Adding contextual descriptions to chunks (Anthropic approach)</li><li><strong>Embedding model improvements:</strong> Better models, Matryoshka, instruction-tuned</li><li><strong>Hybrid search becoming default:</strong> Combining semantic + keyword everywhere</li><li><strong>Production tooling maturity:</strong> RAGAS, LangSmith, TruLens for end-to-end evaluation</li></ul>`},

{id:"q70",ch:"ch9",title:"Scenario: Design a customer-facing RAG chatbot for an e-commerce site.",body:`<h4>System Design</h4><ol><li><strong>Knowledge sources:</strong> Product catalog (structured), FAQs, shipping policies, return policies, size guides</li><li><strong>Structured data handling:</strong> Product search via SQL/Elasticsearch for exact queries ("red shoes under $50"), RAG for natural language ("comfortable shoes for standing all day")</li><li><strong>Hybrid retrieval:</strong> Combine product search + FAQ semantic search + policy keyword search</li><li><strong>Conversation memory:</strong> Remember what user was looking at, their preferences</li><li><strong>Guardrails:</strong> Don't make false promises about products, never provide competitor info</li><li><strong>Escalation:</strong> Route to human for complaints, order issues, complex returns</li><li><strong>Metrics:</strong> Resolution rate, user satisfaction, conversion impact, escalation rate</li></ol>`}
];

{tp:"Fundamentals",d:2,q:"RAG is preferred over fine-tuning for knowledge injection because:",o:["It's always faster","Knowledge can be updated in minutes, citations are possible, and no training is needed","It's cheaper always","It works with any model"],a:1,x:"RAG: update docs in minutes, cite sources, no training cost. Fine-tuning: hours/days, can hallucinate learned facts, no citations."},

{tp:"Advanced",d:2,q:"GraphRAG uses knowledge graphs for RAG because:",o:["Graphs are faster","They capture entity relationships enabling multi-hop reasoning across connected information","They need less storage","They're simpler"],a:1,x:"Questions about relationships ('Who reports to the CTO?') require graph traversal, not just similarity search."},

{tp:"Evaluation",d:1,q:"RAGAS framework evaluates RAG on:",o:["Only speed","Faithfulness, answer relevancy, context precision, and context recall","Only accuracy","Only cost"],a:1,x:"RAGAS provides multi-dimensional evaluation: is the answer faithful? Relevant? Was retrieval precise? Complete?"},
{tp:"Production",d:2,q:"Multi-tenant RAG data isolation is typically implemented with:",o:["Separate servers per tenant","Metadata filtering with tenant_id at query time","Encryption only","No isolation needed"],a:1,x:"Most common: single index with tenant_id metadata. Filter at query time to ensure data isolation. Test rigorously."},
{tp:"Production",d:2,q:"To keep a RAG knowledge base current, use:",o:["Full re-indexing daily","Incremental indexing — detect changed documents, re-embed only those","Never update","Manual updates only"],a:1,x:"Track document hashes. Only re-embed when content changes. Webhook triggers for real-time updates. Delete removed docs."},
{tp:"Scenarios",d:2,q:"RAG system returns irrelevant results. The FIRST debugging step is:",o:["Change the LLM","Print and examine the actual retrieved chunks — is it a retrieval or generation problem?","Add more documents","Increase chunk size"],a:1,x:"Always diagnose the bottleneck first. Print retrieved chunks. If irrelevant → retrieval problem. If relevant but wrong answer → generation problem."},
{tp:"Scenarios",d:2,q:"For a legal RAG system, the most critical requirement is:",o:["Fast responses","Self-hosted infrastructure with precise citation, confidence scoring, and human review for high-stakes queries","Cheapest model","Largest context window"],a:1,x:"Legal requires: data privacy (self-hosted), precise language, citations to specific paragraphs, and human-in-the-loop for critical decisions."},
{tp:"Chunking",d:2,q:"Semantic chunking splits text where:",o:["Every 500 characters","The embedding similarity between consecutive sentences drops, indicating a topic change","Every paragraph","Randomly"],a:1,x:"Semantic chunking detects topic boundaries. Each chunk covers one coherent topic → better embeddings and retrieval."},
{tp:"VectorDB",d:1,q:"pgvector is best suited when:",o:["You need billion-scale search","You already use PostgreSQL and have <1M vectors","You need GPU-accelerated search","You need the fastest possible queries"],a:1,x:"pgvector = PostgreSQL extension. Great for teams already on Postgres with moderate scale. Avoids new infrastructure."},
{tp:"Embeddings",d:2,q:"Matryoshka embeddings allow:",o:["Faster training","Truncating vectors to fewer dimensions with minimal quality loss — reducing storage 4-8x","Better accuracy always","Larger models"],a:1,x:"Named after nesting dolls — first 256 dims of a 1024-dim vector are still useful. Trade storage savings for slight quality reduction."},
{tp:"Advanced",d:2,q:"Self-RAG differs from standard RAG because:",o:["It uses no retrieval","The model itself decides WHEN to retrieve and evaluates whether its answer is factually supported","It always retrieves","It skips generation"],a:1,x:"Self-RAG is adaptive: retrieve only when needed, self-evaluate faithfulness. More efficient and accurate than always-retrieve."},
{tp:"Retrieval",d:2,q:"Contextual compression in RAG works by:",o:["Compressing the model","Extracting only query-relevant sentences from retrieved chunks before sending to LLM","Reducing chunk size","Quantizing embeddings"],a:1,x:"Chunks often contain irrelevant sentences. Extracting only relevant parts reduces noise, lowers cost, and improves answer quality."},
{tp:"Production",d:2,q:"The biggest cost component of a RAG system is typically:",o:["Embedding generation","LLM generation — tokens for context + answer are the primary cost driver","Vector database","Reranking"],a:1,x:"LLM generation with large contexts dominates cost. Optimize with caching, model routing, and context compression."},
{tp:"Fundamentals",d:2,q:"Naive RAG vs Advanced RAG: the key improvements in Advanced RAG are:",o:["Larger model","Query rewriting, hybrid search, reranking, and context compression","More data","Faster hardware"],a:1,x:"Advanced RAG optimizes pre-retrieval (query), retrieval (hybrid+rerank), and post-retrieval (compression, verification)."},
{tp:"Scenarios",d:2,q:"RAG system is too slow (3s response time). The highest-impact optimization is:",o:["Bigger GPU","Semantic caching for repeated queries + streaming LLM output for perceived speed","Smaller chunks","More indexes"],a:1,x:"Caching: 10ms for cache hits (common queries). Streaming: user sees tokens immediately instead of waiting 3s for full response."},
{tp:"Evaluation",d:2,q:"End-to-end RAG evaluation requires measuring:",o:["Only retrieval quality","Both retrieval quality (precision/recall) AND generation quality (faithfulness/relevancy) together","Only generation quality","Only latency"],a:1,x:"Good retrieval + good generation ≠ guaranteed good end-to-end. Must evaluate components independently AND the final answer."},
{tp:"Advanced",d:2,q:"Agentic RAG improves over traditional RAG because:",o:["It's simpler","An agent decides IF, WHAT, and WHEN to retrieve instead of always retrieving with fixed parameters","It uses no LLM","It skips chunking"],a:1,x:"Agents adaptively search: skip retrieval for simple questions, search multiple times for complex ones, refine queries."},
{tp:"VectorDB",d:2,q:"Metadata filtering in vector search is important because:",o:["It replaces semantic search","It combines structured filters (department, date) with similarity search for more precise results","It's faster","It needs no index"],a:1,x:"'HR policies from 2024' needs both semantic match (policies) and metadata filter (department=HR, year=2024)."},
{tp:"Chunking",d:1,q:"Contextual chunking (Anthropic approach) prepends each chunk with:",o:["Random text","An LLM-generated description of the chunk's context within the larger document","The full document","Nothing"],a:1,x:"LLM generates: 'This chunk is from the Benefits section of the Employee Handbook, discussing PTO policies.' This context improves embedding quality."}
];

// ENGINE
var prog={},PROG_KEY="rag_progress";
function loadProg(){try{var d=localStorage.getItem(PROG_KEY);if(d)prog=JSON.parse(d)}catch(e){prog={}}}
function saveProg(){try{localStorage.setItem(PROG_KEY,JSON.stringify(prog))}catch(e){}}
function renderQuestions(){var main=document.getElementById('mainContent');var chapters={ch0:{title:"🔍 RAG & Vector Databases — Complete Interview Guide",desc:"100 questions covering the full RAG ecosystem for 2025 interviews."},ch1:{title:"🔍 RAG Fundamentals",desc:"Architecture, pipeline, RAG vs fine-tuning, semantic search."},ch2:{title:"✂️ Chunking Strategies",desc:"Fixed, recursive, semantic, hierarchical, contextual chunking."},ch3:{title:"📐 Embeddings & Models",desc:"Embedding models, cosine similarity, bi-encoder vs cross-encoder."},ch4:{title:"🗄️ Vector Databases",desc:"Pinecone, Qdrant, Weaviate, pgvector, ANN algorithms, hybrid search."},ch5:{title:"🎯 Retrieval Strategies",desc:"Query expansion, HyDE, reranking, self-query, compression."},ch6:{title:"🚀 Advanced RAG",desc:"CRAG, Self-RAG, Agentic RAG, GraphRAG, RAPTOR, ColBERT."},ch7:{title:"📊 Evaluation & Metrics",desc:"RAGAS, faithfulness, precision/recall, LLM-as-judge."},ch8:{title:"🏗️ Production RAG",desc:"Deployment, updates, multi-tenant, costs, monitoring, permissions."},ch9:{title:"🎭 Scenarios & System Design",desc:"Real-world RAG system design, debugging, optimization."},mock:{title:"🎯 Mock Tests",desc:"Test your RAG knowledge."}};
var html='';for(var ch in chapters){var info=chapters[ch];var qs=ch==='ch0'?QDB:(ch==='mock'?[]:QDB.filter(function(q){return q.ch===ch}));html+='<section id="'+ch+'" class="content-section'+(ch==='ch0'?' active':'')+'"><h1>'+info.title+'</h1><p style="color:var(--tx2);margin-bottom:20px">'+info.desc+'</p>';if(ch==='mock'){html+='<div id="mockArea"></div>'}else{qs.forEach(function(q,i){var num=ch==='ch0'?(i+1):(qs.indexOf(q)+1);html+='<div class="dd" data-sub-id="'+q.id+'"><button class="dd-head" onclick="toggleSub(this)"><span class="dd-chk" id="chk_'+q.id+'"></span><span class="dd-t">Q'+num+': '+q.title+'</span><svg class="dd-arr" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7 5l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="dd-body" id="body_'+q.id+'">'+q.body+'<button class="done-btn" onclick="markDone(\''+q.id+'\',this)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Mark Complete</button></div></div>'})}html+='</section>'}main.innerHTML=html}
function toggleSub(b){var o=b.classList.contains('open');document.querySelectorAll('.dd-head.open').forEach(function(h){h.classList.remove('open');h.nextElementSibling.classList.remove('open')});if(!o){b.classList.add('open');b.nextElementSibling.classList.add('open')}}
function markDone(id,btn){if(prog[id]){delete prog[id];btn.classList.remove('ok');btn.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Mark Complete';var c=document.getElementById('chk_'+id);if(c)c.classList.remove('ok');var d=btn.closest('.dd');if(d)d.classList.remove('done')}else{prog[id]=1;btn.classList.add('ok');btn.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Completed ✓';var c=document.getElementById('chk_'+id);if(c)c.classList.add('ok');var d=btn.closest('.dd');if(d)d.classList.add('done');showToast('✓ Done!')}saveProg();updStats()}
function applyDone(){for(var id in prog){var c=document.getElementById('chk_'+id);if(c){c.classList.add('ok');var d=c.closest('.dd');if(d)d.classList.add('done');var b=d?d.querySelector('.done-btn'):null;if(b){b.classList.add('ok');b.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Completed ✓'}}}}
function updStats(){var seen={};document.querySelectorAll('[data-sub-id]').forEach(function(s){seen[s.getAttribute('data-sub-id')]=true});var total=Object.keys(seen).length,done=0;for(var k in seen)if(prog[k])done++;document.getElementById('stDone').textContent=done;document.getElementById('stTotal').textContent=total;var pct=total?Math.round(done/total*100):0;document.getElementById('pbar').style.width=pct+'%';document.getElementById('pringBar').style.width=pct+'%';['ch1','ch2','ch3','ch4','ch5','ch6','ch7','ch8','ch9'].forEach(function(ch){var sec=document.getElementById(ch);if(!sec)return;var subs=sec.querySelectorAll('[data-sub-id]'),t=subs.length,d=0;subs.forEach(function(s){if(prog[s.getAttribute('data-sub-id')])d++});var np=document.getElementById('np_'+ch);if(np&&t)np.textContent=d+'/'+t});var np0=document.getElementById('np_ch0');if(np0)np0.textContent=done+'/'+total}
function showSection(id){document.querySelectorAll('.content-section').forEach(function(s){s.classList.remove('active')});var sec=document.getElementById(id);if(sec)sec.classList.add('active');document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.getAttribute('data-section')===id)});if(id==='mock')renderMockHome();if(window.innerWidth<768)toggleSidebar();window.scrollTo(0,0)}
function handleSearch(q){if(!q){document.querySelectorAll('.dd').forEach(function(d){d.style.display=''});return}q=q.toLowerCase();document.querySelectorAll('.dd').forEach(function(d){var t=d.querySelector('.dd-t');d.style.display=t&&t.textContent.toLowerCase().includes(q)?'':'none'})}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}
function toggleTheme(){var b=document.body;b.getAttribute('data-theme')==='light'?b.removeAttribute('data-theme'):b.setAttribute('data-theme','light');document.getElementById('themeBtn').innerHTML=(b.getAttribute('data-theme')==='light')?'☀️ <span class="bl">Light</span>':'🌙 <span class="bl">Dark</span>'}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function resetProgress(){if(!confirm('Reset?'))return;prog={};saveProg();document.querySelectorAll('.dd').forEach(function(d){d.classList.remove('done')});document.querySelectorAll('.dd-chk').forEach(function(c){c.classList.remove('ok')});document.querySelectorAll('.done-btn').forEach(function(b){b.classList.remove('ok');b.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Mark Complete'});updStats();showToast('Reset!')}
var mS={scores:{},qs:[],qI:0,ans:{},sub:false,timer:0,tInt:null,tI:0};
function renderMockHome(){var el=document.getElementById('mockArea');if(!el)return;var tests=[{n:"Test 1",d:"Fundamentals, Chunking & Embeddings",c:15},{n:"Test 2",d:"Vector DBs & Retrieval",c:15},{n:"Test 3",d:"Advanced RAG, Eval & Production",c:15},{n:"Test 4",d:"Full Comprehensive",c:30}];var h='<div class="mg">';tests.forEach(function(t,i){var sc=mS.scores[i];h+='<div class="mc" onclick="startMock('+i+')"><div class="mn">'+t.n+'</div><div class="mt">'+t.d+'</div><div class="mi">'+t.c+' questions</div>';if(sc!==undefined)h+='<div style="font-family:var(--fc);font-size:11px;color:var(--grn);margin-top:6px">Last: '+sc+'%</div>';h+='</div>'});h+='</div>';el.innerHTML=h}
function getMQ(i){var s=QB.slice().sort(function(){return Math.random()-.5});if(i===0)return s.filter(function(q){return q.tp==='Fundamentals'||q.tp==='Chunking'||q.tp==='Embeddings'}).slice(0,15);if(i===1)return s.filter(function(q){return q.tp==='VectorDB'||q.tp==='Retrieval'}).slice(0,15);if(i===2)return s.filter(function(q){return q.tp==='Advanced'||q.tp==='Evaluation'||q.tp==='Production'||q.tp==='Scenarios'}).slice(0,15);return s.slice(0,30)}
function startMock(i){mS={scores:mS.scores,qs:getMQ(i),qI:0,ans:{},sub:false,timer:0,tInt:null,tI:i};mS.tInt=setInterval(function(){mS.timer++;renderMQ()},1000);renderMQ()}
function renderMQ(){var el=document.getElementById('mockArea');if(!el)return;var qs=mS.qs,q=qs[mS.qI],ci=mS.qI,m=Math.floor(mS.timer/60),s=mS.timer%60;var h='<div class="qz-h"><span class="pg">Q'+(ci+1)+'/'+qs.length+'</span><span class="tm">⏱ '+m+':'+(('0'+s).slice(-2))+'</span><button onclick="endM()">✕</button></div><div class="qc"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="badge b0">'+q.tp+'</span><div class="diff">';for(var i=0;i<3;i++)h+='<i'+(i<q.d?' class="on"':'')+'></i>';h+='</div></div><div class="qt">'+q.q+'</div><div class="opts">';['A','B','C','D'].forEach(function(L,oi){var cls='opt';if(mS.sub){if(oi===q.a)cls+=' correct';else if(mS.ans[ci]===oi)cls+=' wrong'}else if(mS.ans[ci]===oi)cls+=' sel';h+='<div class="'+cls+'" onclick="selO('+ci+','+oi+')"><span class="olet">'+L+'</span><span>'+q.o[oi]+'</span></div>'});h+='</div>';if(mS.sub)h+='<div class="exp show">'+q.x+'</div>';h+='<div class="qnav">';h+=ci>0?'<button class="qb" onclick="mNav('+(ci-1)+')">← Prev</button>':'<span></span>';h+=ci<qs.length-1?'<button class="qb p" onclick="mNav('+(ci+1)+')">Next →</button>':(!mS.sub?'<button class="qb p" onclick="subM()">Submit</button>':'<button class="qb p" onclick="renderMockHome()">Back</button>');h+='</div></div>';el.innerHTML=h}
function selO(qi,oi){if(!mS.sub){mS.ans[qi]=oi;renderMQ()}}
function mNav(i){mS.qI=i;renderMQ();window.scrollTo(0,0)}
function endM(){if(mS.tInt)clearInterval(mS.tInt);renderMockHome()}
function subM(){if(!confirm('Submit?'))return;mS.sub=true;if(mS.tInt)clearInterval(mS.tInt);var c=0;mS.qs.forEach(function(q,i){if(mS.ans[i]===q.a)c++});var pct=Math.round(c/mS.qs.length*100);mS.scores[mS.tI]=pct;var m=Math.floor(mS.timer/60),s=mS.timer%60;document.getElementById('mockArea').innerHTML='<div class="rcard"><div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700">Complete</div><div class="rpct '+(pct>=60?'pass':'fail')+'">'+pct+'%</div><div style="font-size:15px;font-weight:700;margin-bottom:10px">'+(pct>=60?'🎉 Passed!':'📚 Keep Practicing!')+'</div><div class="rrow"><div class="ri"><div class="rv" style="color:var(--grn)">'+c+'</div><div class="rl">Correct</div></div><div class="ri"><div class="rv" style="color:var(--red)">'+(mS.qs.length-c)+'</div><div class="rl">Wrong</div></div><div class="ri"><div class="rv" style="color:var(--ac)">'+m+':'+(('0'+s).slice(-2))+'</div><div class="rl">Time</div></div></div><div class="rbtns"><button class="qb" onclick="mS.qI=0;renderMQ()">📖 Review</button><button class="qb p" onclick="renderMockHome()">Back</button></div></div>'}
loadProg();renderQuestions();applyDone();updStats();
window.addEventListener('scroll',function(){document.getElementById('sttBtn').classList.toggle('show',window.scrollY>400)});
</script>
